[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "table2text-pydanticai"
version = "0.1.0"
description = "A PydanticAI multi-agent Table2Text system for reducing hallucinations."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.10,<3.0",
    "pydantic-ai-slim[openai]>=1.0,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "openpyxl>=3.1,<4.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

evaluation = [
    "datasets>=3.2,<4.0",
    "huggingface-hub>=0.27,<1.0",
    "sacrebleu>=2.4,<3.0",
    "rouge-score>=0.1.2,<0.2",
    "nltk>=3.9,<4.0",
    "bert-score>=0.3.13,<0.4",
    "transformers>=4.46,<5.0",
    "torch>=2.3,<3.0",
    "sentencepiece>=0.2,<0.3",
    "scipy>=1.13,<2.0",
    "tabulate>=0.9,<1.0",
]

evaluation-ragas = [
    "ragas>=0.3.5,<1.0",
]

evaluation-deepeval = [
    "deepeval",
]

evaluation-hhem = [
    "transformers>=4.46,<5.0",
    "torch>=2.3,<3.0",
]

evaluation-opik = [
    "opik",
]

evaluation-summac = [
    "summac",
]

evaluation-qafacteval = [
    "qafacteval",
]

evaluation-cleanlab = [
    "cleanlab-tlm",
]

evaluation-patronus = [
    "patronus",
]

evaluation-phoenix = [
    "arize-phoenix-evals>=3",
]

evaluation-alignscore = [
    "huggingface-hub>=0.27,<1.0",
    "spacy>=3.7,<4.0",
]

[project.scripts]
table2text = "table2text.cli:main"
table2text-evaluate = "table2text.evaluation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/table2text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
